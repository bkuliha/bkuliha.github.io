<!DOCTYPE html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slovné druhy Jeopardy</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #18202a;
        --muted: #5f6b78;
        --paper: #fffdf8;
        --panel: #f6f1e7;
        --line: #d4c5ad;
        --blue: #165a9f;
        --blue-deep: #0e3460;
        --yellow: #f3bd2f;
        --green: #1d7a5c;
        --red: #b84236;
        --teal: #17808b;
        --violet: #6b579f;
        --shadow: rgba(29, 36, 47, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
        color: var(--ink);
        background:
          linear-gradient(120deg, rgba(22, 90, 159, 0.16), transparent 34%),
          linear-gradient(240deg, rgba(29, 122, 92, 0.15), transparent 30%),
          repeating-linear-gradient(0deg, rgba(24, 32, 42, 0.035) 0 1px, transparent 1px 34px),
          var(--panel);
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app {
        width: min(1440px, calc(100% - 28px));
        margin: 0 auto;
        padding: 22px 0 28px;
      }

      .topbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 18px;
        align-items: end;
        margin-bottom: 16px;
      }

      .title-block {
        display: flex;
        gap: 16px;
        align-items: center;
      }

      .badge-art {
        flex: 0 0 auto;
        width: 78px;
        height: 78px;
        filter: drop-shadow(0 12px 18px rgba(14, 52, 96, 0.18));
      }

      .eyebrow {
        margin: 0 0 5px;
        color: var(--red);
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: var(--blue-deep);
        font-size: clamp(2rem, 5vw, 4.35rem);
        line-height: 0.95;
        letter-spacing: 0;
      }

      .subtitle {
        max-width: 820px;
        margin: 9px 0 0;
        color: var(--muted);
        font-size: 1.02rem;
        line-height: 1.42;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 10px;
      }

      .toolbar button,
      .modal-actions button,
      .score-button,
      .team-score button {
        border: 0;
        border-radius: 8px;
        min-height: 42px;
        padding: 10px 14px;
        color: #fff;
        background: var(--blue);
        font-weight: 900;
        box-shadow: 0 10px 20px rgba(14, 52, 96, 0.14);
      }

      .toolbar .secondary,
      .modal-actions .secondary {
        color: var(--blue-deep);
        background: #fff;
        border: 2px solid #adc1d2;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 18px;
        align-items: start;
      }

      .board-wrap,
      .teams-panel {
        background: rgba(255, 253, 248, 0.94);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 22px 50px var(--shadow);
      }

      .board-wrap {
        padding: 14px;
        overflow-x: auto;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(6, minmax(138px, 1fr));
        gap: 8px;
        min-width: 900px;
      }

      .category {
        display: grid;
        align-content: center;
        min-height: 98px;
        padding: 12px 10px;
        color: #fff;
        text-align: center;
        background: var(--blue-deep);
        border: 3px solid #071d35;
        border-radius: 6px;
      }

      .category svg {
        width: 34px;
        height: 34px;
        margin: 0 auto 5px;
      }

      .category strong {
        display: block;
        font-size: clamp(0.95rem, 1.2vw, 1.18rem);
        line-height: 1.1;
        text-transform: uppercase;
      }

      .tile {
        display: grid;
        place-items: center;
        min-height: 92px;
        border: 3px solid #071d35;
        border-radius: 6px;
        color: var(--yellow);
        background:
          radial-gradient(circle at top left, rgba(255, 255, 255, 0.16), transparent 36%),
          var(--blue);
        font-size: clamp(1.55rem, 3vw, 2.35rem);
        font-weight: 1000;
        text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
      }

      .tile:hover,
      .tile:focus-visible {
        transform: translateY(-2px);
        outline: 4px solid rgba(243, 189, 47, 0.42);
      }

      .tile.used {
        visibility: hidden;
        pointer-events: none;
      }

      .teams-panel {
        position: sticky;
        top: 12px;
        padding: 14px;
      }

      .teams-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }

      .teams-head h2 {
        margin: 0;
        color: var(--blue-deep);
        font-size: 1.35rem;
      }

      .remaining {
        min-width: 54px;
        padding: 8px 10px;
        border-radius: 999px;
        color: #fff;
        background: var(--green);
        text-align: center;
        font-weight: 900;
      }

      .team-list {
        display: grid;
        gap: 10px;
      }

      .team-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
        padding: 10px;
        border: 1px solid #d9d0c2;
        border-radius: 8px;
        background: #fff;
      }

      .team-card input {
        width: 100%;
        min-height: 38px;
        border: 1px solid #bcc8d2;
        border-radius: 6px;
        padding: 8px 9px;
        color: var(--ink);
        font-weight: 800;
      }

      .team-score {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .team-score strong {
        min-width: 58px;
        color: var(--blue-deep);
        font-size: 1.25rem;
        text-align: right;
      }

      .team-score button {
        display: grid;
        place-items: center;
        width: 34px;
        min-height: 34px;
        padding: 0;
        background: var(--teal);
      }

      .modal {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        place-items: center;
        padding: 22px;
        background: rgba(8, 17, 28, 0.68);
      }

      .modal.open {
        display: grid;
      }

      .dialog {
        width: min(900px, 100%);
        max-height: calc(100vh - 44px);
        overflow: auto;
        border: 5px solid var(--yellow);
        border-radius: 8px;
        background: var(--paper);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.4);
      }

      .dialog-head {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 16px;
        align-items: center;
        padding: 18px;
        color: #fff;
        background: var(--blue-deep);
      }

      .dialog-head p {
        margin: 0 0 4px;
        color: #c9dff2;
        font-weight: 800;
      }

      .dialog-head h2 {
        margin: 0;
        font-size: clamp(1.25rem, 3vw, 2rem);
      }

      .points-pill {
        min-width: 92px;
        padding: 11px 14px;
        border: 2px solid rgba(255, 255, 255, 0.5);
        border-radius: 999px;
        color: var(--yellow);
        text-align: center;
        font-size: 1.35rem;
        font-weight: 1000;
      }

      .dialog-body {
        padding: 20px;
      }

      .prompt {
        margin: 0;
        color: var(--ink);
        font-size: clamp(1.35rem, 3vw, 2.1rem);
        line-height: 1.22;
        font-weight: 900;
      }

      .hint {
        margin: 14px 0 0;
        padding: 12px 14px;
        border-left: 5px solid var(--teal);
        background: #eef8f7;
        color: #264653;
        line-height: 1.38;
      }

      .answer-box {
        display: none;
        margin-top: 16px;
        padding: 15px;
        border: 2px solid #a9d6c9;
        border-radius: 8px;
        background: #f2fbf6;
      }

      .answer-box.visible {
        display: block;
      }

      .answer-box strong {
        display: block;
        margin-bottom: 6px;
        color: var(--green);
        font-size: 1.02rem;
      }

      .answer-box p {
        margin: 0;
        font-size: 1.12rem;
        line-height: 1.4;
      }

      .modal-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 0 20px 18px;
      }

      .award-panel {
        display: none;
        padding: 0 20px 22px;
      }

      .award-panel.visible {
        display: block;
      }

      .award-panel h3 {
        margin: 0 0 10px;
        color: var(--blue-deep);
        font-size: 1.05rem;
      }

      .award-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 9px;
      }

      .score-button {
        min-height: 50px;
        background: var(--green);
        overflow-wrap: anywhere;
      }

      .close-x {
        border: 0;
        border-radius: 999px;
        width: 42px;
        height: 42px;
        color: #fff;
        background: rgba(255, 255, 255, 0.15);
        font-size: 1.4rem;
        font-weight: 900;
      }

      .toast {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 30;
        display: none;
        max-width: min(420px, calc(100% - 32px));
        padding: 12px 15px;
        border-radius: 8px;
        color: #fff;
        background: var(--blue-deep);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.24);
        font-weight: 800;
      }

      .toast.show {
        display: block;
      }

      @media (max-width: 1040px) {
        .topbar,
        .layout {
          grid-template-columns: 1fr;
        }

        .toolbar {
          justify-content: flex-start;
        }

        .teams-panel {
          position: static;
        }

        .team-list {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 680px) {
        .app {
          width: min(100% - 18px, 1440px);
          padding-top: 12px;
        }

        .title-block {
          align-items: flex-start;
        }

        .badge-art {
          width: 54px;
          height: 54px;
        }

        .subtitle {
          font-size: 0.95rem;
        }

        .team-list,
        .award-grid {
          grid-template-columns: 1fr;
        }

        .dialog-head {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="title-block">
          <svg class="badge-art" viewBox="0 0 120 120" aria-hidden="true">
            <rect x="14" y="16" width="92" height="88" rx="12" fill="#fffdf8" stroke="#0e3460" stroke-width="6" />
            <path d="M30 41h60M30 60h60M30 79h38" stroke="#165a9f" stroke-width="8" stroke-linecap="round" />
            <circle cx="88" cy="80" r="12" fill="#f3bd2f" stroke="#0e3460" stroke-width="5" />
            <path d="M84 80l4 4 8-10" fill="none" stroke="#0e3460" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <div>
            <p class="eyebrow">4. ročník ZŠ</p>
            <h1>Slovné druhy Jeopardy</h1>
            <p class="subtitle">

            </p>
          </div>
        </div>
        <div class="toolbar" aria-label="Ovládanie hry">
          <button class="secondary" type="button" id="restoreButton">Vrátiť políčka</button>
          <button class="secondary" type="button" id="resetScoresButton">Vynulovať body</button>
          <button type="button" id="resetAllButton">Nová hra</button>
        </div>
      </header>

      <section class="layout">
        <div class="board-wrap" aria-label="Hracia tabuľa">
          <div class="board" id="board"></div>
        </div>

        <aside class="teams-panel" aria-label="Skupiny">
          <div class="teams-head">
            <h2>Skupiny</h2>
            <span class="remaining" id="remainingCount">30</span>
          </div>
          <div class="team-list" id="teamList"></div>
        </aside>
      </section>
    </main>

    <section class="modal" id="questionModal" aria-modal="true" role="dialog" aria-labelledby="modalTitle">
      <article class="dialog">
        <header class="dialog-head">
          <div>
            <p id="modalCategory">Kategória</p>
            <h2 id="modalTitle">Otázka</h2>
          </div>
          <div class="points-pill" id="modalPoints">100</div>
          <button class="close-x" type="button" id="closeModal" aria-label="Zavrieť">×</button>
        </header>

        <div class="dialog-body">
          <p class="prompt" id="modalPrompt"></p>
          <p class="hint" id="modalHint"></p>
          <div class="answer-box" id="answerBox">
            <strong>Správna odpoveď</strong>
            <p id="modalAnswer"></p>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" id="showAnswerButton">Ukázať odpoveď</button>
          <button class="secondary" type="button" id="skipButton">Bez bodov</button>
        </div>

        <div class="award-panel" id="awardPanel">
          <h3>Pripočítať body skupine</h3>
          <div class="award-grid" id="awardGrid"></div>
        </div>
      </article>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

        leaf: '<path d="M68 14C40 16 18 36 17 65c25 4 51-6 58-43 3 24-6 46-30 58" fill="#70c59b" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>',
        water: '<path d="M44 10C30 29 18 46 18 61c0 16 12 27 26 27s26-11 26-27C70 46 58 29 44 10z" fill="#75c7df"/><path d="M33 64c4 8 12 12 22 7" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>',
        body: '<circle cx="44" cy="20" r="12" fill="#f3bd2f"/><path d="M25 42h38M44 32v28M28 82l16-22 16 22" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>',
        home: '<path d="M13 43L44 17l31 26v37H21V43z" fill="#de7c5a"/><path d="M34 80V56h20v24" fill="#fff"/><path d="M13 43L44 17l31 26" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>',
        field: '<path d="M11 69c16-16 49-16 66 0v13H11V69z" fill="#70c59b"/><path d="M18 73c12-9 40-9 52 0M26 82c8-5 28-5 36 0" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M44 13v43M28 25c10 0 16 7 16 16M60 25c-10 0-16 7-16 16" stroke="#f3bd2f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>'
      };

      const state = {
        teams: Array.from({ length: 6 }, (_, index) => ({ name: `Skupina ${index + 1}`, score: 0 })),
        used: new Set(),
        active: null
      };

      const board = document.getElementById("board");
      const teamList = document.getElementById("teamList");
      const remainingCount = document.getElementById("remainingCount");
      const modal = document.getElementById("questionModal");
      const modalCategory = document.getElementById("modalCategory");
      const modalTitle = document.getElementById("modalTitle");
      const modalPoints = document.getElementById("modalPoints");
      const modalPrompt = document.getElementById("modalPrompt");
      const modalHint = document.getElementById("modalHint");
      const modalAnswer = document.getElementById("modalAnswer");
      const answerBox = document.getElementById("answerBox");
      const awardPanel = document.getElementById("awardPanel");
      const awardGrid = document.getElementById("awardGrid");
      const toast = document.getElementById("toast");

      function makeIcon(name) {
        return `<svg viewBox="0 0 88 88" aria-hidden="true">${iconPaths[name]}</svg>`;
      }

      function renderBoard() {
        board.innerHTML = "";
        categories.forEach((category) => {
          const heading = document.createElement("div");
          heading.className = "category";
          heading.innerHTML = `${makeIcon(category.icon)}<strong>${category.title}</strong>`;
          board.appendChild(heading);
        });

        for (let row = 0; row < 5; row += 1) {
          categories.forEach((category, categoryIndex) => {
            const question = category.questions[row];
            const key = `${categoryIndex}-${row}`;
            const tile = document.createElement("button");
            tile.className = `tile${state.used.has(key) ? " used" : ""}`;
            tile.type = "button";
            tile.textContent = question.points;
            tile.setAttribute("aria-label", `${category.title} za ${question.points} bodov`);
            tile.addEventListener("click", () => openQuestion(categoryIndex, row));
            board.appendChild(tile);
          });
        }
        updateRemaining();
      }

      function renderTeams() {
        teamList.innerHTML = "";
        state.teams.forEach((team, index) => {
          const card = document.createElement("article");
          card.className = "team-card";

          const input = document.createElement("input");
          input.value = team.name;
          input.setAttribute("aria-label", `Názov skupiny ${index + 1}`);
          input.addEventListener("input", () => {
            state.teams[index].name = input.value.trim() || `Skupina ${index + 1}`;
            renderAwardButtons();
          });

          const score = document.createElement("div");
          score.className = "team-score";
          score.innerHTML = `<strong>${team.score}</strong>`;

          const minus = document.createElement("button");
          minus.type = "button";
          minus.textContent = "−";
          minus.setAttribute("aria-label", `Odobrať 100 bodov skupine ${team.name}`);
          minus.addEventListener("click", () => adjustScore(index, -100));

          const plus = document.createElement("button");
          plus.type = "button";
          plus.textContent = "+";
          plus.setAttribute("aria-label", `Pridať 100 bodov skupine ${team.name}`);
          plus.addEventListener("click", () => adjustScore(index, 100));

          score.append(minus, plus);
          card.append(input, score);
          teamList.appendChild(card);
        });
      }

      function renderAwardButtons() {
        awardGrid.innerHTML = "";
        state.teams.forEach((team, index) => {
          const button = document.createElement("button");
          button.className = "score-button";
          button.type = "button";
          button.textContent = team.name;
          button.addEventListener("click", () => awardPoints(index));
          awardGrid.appendChild(button);
        });
      }

      function openQuestion(categoryIndex, rowIndex) {
        const key = `${categoryIndex}-${rowIndex}`;
        if (state.used.has(key)) return;

        const category = categories[categoryIndex];
        const question = category.questions[rowIndex];
        state.active = { key, categoryIndex, rowIndex, question };

        modalCategory.textContent = category.title;
        modalTitle.textContent = `Otázka za ${question.points}`;
        modalPoints.textContent = question.points;
        modalPrompt.textContent = question.prompt;
        modalHint.textContent = question.hint;
        modalAnswer.textContent = question.answer;
        answerBox.classList.remove("visible");
        awardPanel.classList.remove("visible");
        modal.classList.add("open");
        document.getElementById("showAnswerButton").focus();
      }

      function closeQuestion() {
        modal.classList.remove("open");
        state.active = null;
      }

      function revealAnswer() {
        answerBox.classList.add("visible");
        awardPanel.classList.add("visible");
      }

      function finishTile(message) {
        if (!state.active) return;
        state.used.add(state.active.key);
        renderBoard();
        closeQuestion();
        showToast(message);
      }

      function awardPoints(teamIndex) {
        if (!state.active) return;
        const points = state.active.question.points;
        state.teams[teamIndex].score += points;
        const teamName = state.teams[teamIndex].name;
        renderTeams();
        finishTile(`${teamName}: +${points} bodov`);
      }

      function adjustScore(teamIndex, amount) {
        state.teams[teamIndex].score += amount;
        renderTeams();
      }

      function updateRemaining() {
        const total = categories.reduce((sum, category) => sum + category.questions.length, 0);
        remainingCount.textContent = total - state.used.size;
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1800);
      }

      function resetScores() {
        state.teams.forEach((team) => {
          team.score = 0;
        });
        renderTeams();
        showToast("Body sú vynulované");
      }

      function restoreTiles() {
        state.used.clear();
        renderBoard();
        showToast("Políčka sú späť v hre");
      }

      function resetAll() {
        restoreTiles();
        resetScores();
        state.teams.forEach((team, index) => {
          team.name = `Skupina ${index + 1}`;
        });
        renderTeams();
        showToast("Nová hra je pripravená");
      }

      document.getElementById("showAnswerButton").addEventListener("click", revealAnswer);
      document.getElementById("skipButton").addEventListener("click", () => finishTile("Políčko uzavreté bez bodov"));
      document.getElementById("closeModal").addEventListener("click", closeQuestion);
      document.getElementById("resetScoresButton").addEventListener("click", resetScores);
      document.getElementById("restoreButton").addEventListener("click", restoreTiles);
      document.getElementById("resetAllButton").addEventListener("click", resetAll);
      modal.addEventListener("click", (event) => {
        if (event.target === modal) closeQuestion();
      });
      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && modal.classList.contains("open")) {
          closeQuestion();
        }
      });

      renderTeams();
      renderAwardButtons();
      renderBoard();
    </script>
  </body>
</html>
