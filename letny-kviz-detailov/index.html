<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Letný kvíz detailov</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800;900&display=swap');
:root{--sea:#22c3ca;--deep:#17657c;--coral:#ff7060;--sun:#ffd443;--ink:#244e5d}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px 12px;font-family:Nunito,sans-serif;color:var(--ink);background:linear-gradient(#8de4eb 0 285px,#fff0b9 285px)}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 8% 5%,#fffbd7 0 30px,transparent 31px),radial-gradient(circle at 92% 11%,#ffd447 0 56px,transparent 57px);opacity:.8}main{position:relative;max-width:760px;margin:auto;text-align:center}.badge{display:inline-block;margin:0;padding:6px 14px;border-radius:99px;background:#fff8d4;color:#db6943;font-size:.8rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase}h1{margin:5px 0;font:800 clamp(2.7rem,8vw,5rem)/.95 'Baloo 2';color:#fffef3;text-shadow:0 4px #2993aa,0 8px 14px #08778522}.sub{margin:8px 0;color:#1a6379;font-weight:900}.card{margin-top:23px;padding:clamp(18px,4vw,33px);background:#fffdf4;border:4px solid white;border-radius:29px;box-shadow:0 18px #519ca944,0 27px 50px #287b8d22}.hidden{display:none}.intro h2,.result h2{margin:10px 0;font:800 clamp(2rem,6vw,3.4rem)/1 'Baloo 2';color:#e96a49}.intro p,.result p{max-width:540px;margin:14px auto;color:#547987;font-weight:800;line-height:1.45}.primary,.next{border:0;cursor:pointer;font:900 1rem Nunito;padding:13px 24px;border-radius:99px;color:white;background:linear-gradient(135deg,#ff637c,#ff914c);box-shadow:0 5px #d25365}.top{display:flex;justify-content:space-between;align-items:center;gap:13px;font-weight:900;text-align:left}.score{padding:8px 13px;border-radius:99px;background:#fff0b9;color:#a6650f}.progress{height:12px;margin:14px 0 21px;overflow:hidden;border-radius:99px;background:#deefed}.progress span{display:block;height:100%;background:linear-gradient(90deg,#ff657b,#ff994b,#ffd443);transition:width .35s}.game h2{margin:0;font:800 clamp(1.6rem,4vw,2.3rem)/1.1 'Baloo 2';color:#e76a48}.detail,.reveal-img{display:block;width:min(100%,570px);aspect-ratio:1.55;margin:17px auto;object-fit:cover;border:9px solid white;border-radius:23px;box-shadow:0 10px 20px #719ba43d}.answer-form{display:flex;max-width:570px;margin:auto;gap:9px}.answer-form input{flex:1;min-width:0;padding:13px 15px;border:3px solid #cfe9eb;border-radius:15px;outline:0;color:var(--ink);font:900 1rem Nunito}.answer-form input:focus{border-color:var(--sea)}.send{border:0;border-radius:15px;padding:12px 19px;color:white;background:var(--deep);font:900 1rem Nunito;cursor:pointer;box-shadow:0 4px #104d62}.feedback{min-height:28px;margin:16px 0 0;font-weight:900}.good{color:#27895c}.bad{color:#c65762}.reveal{margin-top:15px;padding:14px;border-radius:19px;background:#fff4d1}.reveal h3{margin:0;font:800 1.35rem 'Baloo 2';color:#d76a42}.reveal-img{margin:10px auto 0;border-width:5px}.next{margin-top:15px;background:var(--deep);box-shadow:0 4px #104d62}@media(max-width:540px){.answer-form{flex-direction:column}.send{width:100%}.detail{aspect-ratio:1.2}}</style>
</head>
<body><main><header><p class="badge">🌞 Letný obrázkový kvíz</p><h1>Čo je na detaile?</h1><p class="sub">Napíš správne slovo a odhaľ letný obrázok.</p></header>
<section class="card"><div id="intro" class="intro"><p class="badge">20 pripravených hádaniek</p><h2>Poďme na leto!</h2><p>Všetky otázky a odpoveďové obrázky sú už načítané z priečinka <strong>uploads</strong>. Stačí hádať.</p><button id="start" class="primary">Začať kvíz ✨</button></div>
<div id="game" class="game hidden"><div class="top"><span id="counter"></span><span id="score" class="score"></span></div><div class="progress"><span id="bar"></span></div><h2>Čo je na tomto detaile?</h2><img id="detail" class="detail" alt="Detail obrázka"><form id="form" class="answer-form"><input id="typed" autocomplete="off" placeholder="Napíš odpoveď v nominatíve…" aria-label="Tvoja odpoveď"><button class="send">Odoslať</button></form><p id="feedback" class="feedback" aria-live="polite"></p><div id="reveal" class="reveal hidden"><h3 id="reveal-word"></h3><img id="answer-image" class="reveal-img" alt="Správna odpoveď"></div><button id="next" class="next hidden">Ďalšia hádanka →</button></div>
<div id="result" class="result hidden"><p class="badge">Plážové finále</p><h2 id="final"></h2><p id="final-text"></p><button id="again" class="primary">Hrať znova 🌴</button></div></section></main><script src="game.js"></script></body></html>
