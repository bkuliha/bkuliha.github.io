<!DOCTYPE html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generátor pracovných listov - Tajný obrázok</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f1e9;
        --panel: #fffdf8;
        --ink: #1e211f;
        --muted: #62645f;
        --line: #d7d0c2;
        --accent: #21675e;
        --accent-dark: #164940;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 10% 6%, rgba(33, 103, 94, 0.15), transparent 28%),
          radial-gradient(circle at 92% 12%, rgba(220, 149, 63, 0.16), transparent 28%),
          linear-gradient(180deg, #fbfaf6, var(--bg));
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app {
        width: min(1240px, calc(100% - 28px));
        margin: 28px auto 48px;
      }

      .topbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 18px;
        align-items: end;
        margin-bottom: 18px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--accent);
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4.5vw, 4rem);
        line-height: 1;
      }

      .intro {
        max-width: 780px;
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 1.04rem;
        line-height: 1.5;
      }

      .toolbar,
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .toolbar {
        justify-content: flex-end;
      }

      .button {
        min-height: 40px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 13px;
        background: #fff;
        color: var(--ink);
        font-weight: 800;
      }

      .button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      .button:hover,
      .button:focus-visible {
        border-color: var(--accent-dark);
        box-shadow: 0 0 0 3px rgba(33, 103, 94, 0.15);
      }

      .layout {
        display: grid;
        grid-template-columns: 230px minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 253, 248, 0.96);
      }

      .sidebar {
        position: sticky;
        top: 16px;
        padding: 12px;
      }

      .sheet-tabs {
        display: grid;
        gap: 7px;
      }

      .sheet-tab {
        display: grid;
        grid-template-columns: 32px minmax(0, 1fr);
        gap: 8px;
        align-items: center;
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px;
        background: #fff;
        color: var(--ink);
        text-align: left;
      }

      .sheet-tab.active {
        border-color: var(--accent);
        box-shadow: inset 4px 0 0 var(--accent);
      }

      .mini {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        width: 32px;
        height: 32px;
        border: 1px solid var(--line);
        overflow: hidden;
      }

      .mini i {
        display: block;
      }

      .editor {
        display: grid;
        gap: 16px;
        padding: clamp(14px, 2vw, 22px);
      }

      .editor-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(290px, 0.9fr);
        gap: 16px;
      }

      .field-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 10px;
      }

      label span,
      .section-title {
        display: block;
        margin-bottom: 5px;
        color: var(--muted);
        font-size: 0.86rem;
        font-weight: 800;
      }

      input[type="text"],
      textarea,
      select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
      }

      input[type="text"],
      select {
        min-height: 40px;
        padding: 8px 10px;
      }

      textarea {
        min-height: 82px;
        padding: 10px;
        line-height: 1.45;
        resize: vertical;
      }

      .map-tools {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: end;
      }

      .map-grid,
      .worksheet-grid {
        display: grid;
        grid-template-columns: repeat(10, minmax(0, 1fr));
        border: 2px solid var(--ink);
        background: var(--ink);
        gap: 1px;
      }

      .map-grid {
        width: min(100%, 620px);
        aspect-ratio: 1;
      }

      .map-cell {
        min-width: 0;
        border: 0;
        padding: 0;
        background: #fff;
      }

      .map-cell select {
        height: 100%;
        min-height: 0;
        border: 0;
        border-radius: 0;
        padding: 2px;
        color: #111;
        font-size: clamp(0.52rem, 1vw, 0.78rem);
        font-weight: 800;
        text-align: center;
      }

      .color-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .color-row {
        display: grid;
        grid-template-columns: 30px minmax(0, 1fr);
        gap: 8px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px;
        background: #fff;
      }

      .color-row input {
        width: 30px;
        height: 30px;
        border: 0;
        padding: 0;
        background: transparent;
      }

      .color-row strong {
        display: block;
        font-size: 0.88rem;
        line-height: 1.15;
      }

      .color-row small {
        color: var(--muted);
        font-size: 0.76rem;
      }

      .preview {
        padding: 18px;
      }

      .worksheet {
        max-width: 760px;
        margin: 0 auto;
        background: #fff;
        color: #111;
      }

      .worksheet h2 {
        margin: 0 0 8px;
        font-size: clamp(1.5rem, 3vw, 2.2rem);
        line-height: 1.1;
      }

      .worksheet-desc {
        margin: 0 0 14px;
        line-height: 1.45;
      }

      .legend {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 6px;
        margin-bottom: 12px;
      }

      .legend-item {
        min-height: 34px;
        border: 1px solid #bbb;
        border-radius: 6px;
        padding: 6px;
        background: #fff;
        font-size: 0.82rem;
        font-weight: 800;
      }

      .swatch {
        display: inline-block;
        width: 14px;
        height: 14px;
        margin-right: 6px;
        border: 1px solid rgba(0, 0, 0, 0.35);
        vertical-align: -2px;
      }

      .worksheet-grid {
        width: min(100%, 680px);
        aspect-ratio: 1;
        margin: 0 auto;
      }

      .word-cell {
        display: grid;
        place-items: center;
        min-width: 0;
        padding: 2px;
        background: #fff;
        font-size: clamp(0.54rem, 1vw, 0.78rem);
        font-weight: 800;
        line-height: 1.05;
        text-align: center;
        overflow-wrap: anywhere;
      }

      .answer-space {
        margin-top: 18px;
        border: 2px solid #111;
        min-height: 72px;
        padding: 10px;
        font-weight: 800;
      }

      .answer-key {
        margin-top: 14px;
      }

      .answer-key .word-cell {
        color: transparent;
      }

      .print-stack {
        display: none;
      }

      @media (max-width: 980px) {
        .topbar,
        .layout,
        .editor-grid {
          grid-template-columns: 1fr;
        }

        .toolbar {
          justify-content: flex-start;
        }

        .sidebar {
          position: static;
        }
      }

      @media print {
        @page {
          size: A4 portrait;
          margin: 10mm;
        }

        body {
          background: #fff;
        }

        .app {
          width: auto;
          margin: 0;
        }

        .topbar,
        .layout {
          display: none;
        }

        .print-stack {
          display: block;
        }

        .print-sheet {
          break-after: page;
        }

        .print-sheet:last-child {
          break-after: auto;
        }

        .worksheet h2 {
          font-size: 25px;
        }

        .worksheet-desc {
          font-size: 12px;
          margin-bottom: 8px;
        }

        .legend {
          grid-template-columns: repeat(5, 1fr);
          gap: 4px;
          margin-bottom: 8px;
        }

        .legend-item {
          min-height: 0;
          padding: 4px;
          font-size: 10px;
        }

        .worksheet-grid {
          width: 178mm;
        }

        .word-cell {
          font-size: 8.6px;
        }

        .answer-key {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">editor pre učiteľa</p>
          <h1>Tajný obrázok zo slovných druhov</h1>
          <p class="intro">
            Vyber pracovný list, naklikaj v tabuľke 10 × 10 slovné druhy a nastav farby. Aplikácia doplní
            rôzne slová bez opakovania v rámci jedného pracovného listu.
          </p>
        </div>
        <div class="toolbar">
          <button class="button" type="button" id="generateButton">Nové slová</button>
          <button class="button" type="button" id="printCurrentButton">Tlačiť aktuálny PL</button>
          <button class="button primary" type="button" id="printAllButton">Tlačiť všetkých 10 PL</button>
        </div>
      </header>

      <section class="layout">
        <aside class="panel sidebar">
          <div class="sheet-tabs" id="sheetTabs"></div>
        </aside>

        <section class="panel editor">
          <div class="field-grid">
            <label>
              <span>Nadpis pracovného listu</span>
              <input id="titleInput" type="text" />
            </label>
            <label>
              <span>Popis aktivity</span>
              <textarea id="descriptionInput"></textarea>
            </label>
          </div>

          <div class="editor-grid">
            <section>
              <div class="map-tools">
                <label>
                  <span>Rýchly výber slovného druhu</span>
                  <select id="activePartSelect"></select>
                </label>
                <button class="button" type="button" id="fillButton">Vyplniť všetko</button>
              </div>
              <p class="section-title">Mapa tajného obrázka</p>
              <div class="map-grid" id="mapGrid" aria-label="Mapa slovných druhov 10 krát 10"></div>
            </section>

            <section>
              <p class="section-title">Farby pre tento pracovný list</p>
              <div class="color-grid" id="colorGrid"></div>
            </section>
          </div>

          <div class="actions">
            <button class="button primary" type="button" id="refreshPreviewButton">Obnoviť náhľad</button>
            <button class="button" type="button" id="clearButton">Vyčistiť mapu</button>
          </div>

          <section class="panel preview" id="preview"></section>
        </section>
      </section>

      <section class="print-stack" id="printStack"></section>
    </main>

    <script>
      const parts = [
        { id: "noun", label: "podstatné meno", short: "PM", color: "#4ea3d9" },
        { id: "adjective", label: "prídavné meno", short: "PrM", color: "#67b567" },
        { id: "verb", label: "sloveso", short: "S", color: "#e65f56" },
        { id: "pronoun", label: "zámeno", short: "Z", color: "#f0cf55" },
        { id: "numeral", label: "číslovka", short: "Č", color: "#9b73d9" },
        { id: "adverb", label: "príslovka", short: "Prí", color: "#ee9b49" },
        { id: "preposition", label: "predložka", short: "Pred", color: "#5fc4b8" },
        { id: "conjunction", label: "spojka", short: "Sp", color: "#f284b6" },
        { id: "particle", label: "častica", short: "Čas", color: "#9a8f7f" },
        { id: "interjection", label: "citoslovce", short: "Cit", color: "#b88752" }
      ];

      const partById = Object.fromEntries(parts.map((part) => [part.id, part]));
      const defaultDescription = "Vyhľadaj v tabuľke slová podľa slovných druhov. Každý slovný druh vyfarbi farbou z legendy. Ak budeš postupovať správne, vznikne tajný obrázok. Pod tabuľku napíš, čo obrázok znázorňuje.";

      const banks = {
        noun: "dom škola lavica pero zošit kniha strom kvet lúka rieka jazero more mesto dedina cesta most dvor záhrada oblak slnko mesiac hviezda trieda učiteľ žiak mama otec brat sestra kamarát pes mačka vták ryba lopta okno dvere stôl stolička taška mapa obrázok hrad auto vlak loď les kopec hora pole chlieb voda jablko hruška zvonček ihrisko hodina výlet rozprávka otázka odpoveď hra úloha papier farbička ceruzka pravítko tabuľa krieda počítač klávesnica príbeh báseň pieseň divadlo kino obchod lekár pošta park námestie ulica stan batoh stanica zastávka koláč polievka tanier lyžica pohár ruka noha hlava oko ucho nos".split(" "),
        adjective: "malý veľký tichý hlasný veselý smutný rýchly pomalý zelený modrý červený žltý biely čierny hnedý pekný nový starý múdry šikovný usilovný milý dobrý sladký slaný teplý studený hladký drsný ľahký ťažký čistý mokrý suchý jasný tmavý krátky dlhý široký úzky vysoký nízky okrúhly rovný krivý farebný jarný letný jesenný zimný školský domáci lesný vodný slnečný nočný ranný večerný bezpečný odvážny zvedavý pokojný veselší najlepší prvý druhý tretí drevený kamenný sklenený papierový zlatý strieborný mäkký tvrdý voňavý chutný zdravý čerstvý".split(" "),
        verb: "beží kráča sedí stojí číta píše kreslí počíta spieva hrá skáče letí pláva rastie kvitne svieti horí fúka prší sneží volá počúva hľadá nachádza nesie dáva berie otvára zatvára stavia varí pečie učí skúša myslí vie chce môže musí ide príde odišiel prišiel zobral položil uvidel povedal zaspal zobudil sa smial plakal tešil prosil ďakoval pomáha opravuje maľuje skladá lepí strihá meria cestuje objavuje skúma pozoruje opisuje vysvetľuje odpovedá rozpráva ukazuje kupuje predáva čaká zastaví zabočí vyletí pristane".split(" "),
        pronoun: "ja ty on ona ono my vy oni ony ten tá to tí tie tento táto toto tamten tamtá môj moja moje tvoj tvoja tvoje jeho jej náš naša naše váš vaša vaše ich seba sebe si svoj svoja svoje kto čo aký ktorý čí niekto niečo nikto nič každý všetci sám sama samé".split(" "),
        numeral: "jeden dva tri štyri päť šesť sedem osem deväť desať jedenásť dvanásť trinásť štrnásť pätnásť šestnásť sedemnásť osemnásť devätnásť dvadsať tridsať štyridsať päťdesiat sto prvý druhý tretí štvrtý piaty šiesty siedmy ôsmy deviaty desiaty dvojo trojo štvoro päťoro raz dvakrát trikrát štyrikrát polovica tretina štvrtina".split(" "),
        adverb: "dnes zajtra včera ráno večer teraz potom hneď skoro neskoro rýchlo pomaly ticho hlasno veselo smutne dobre zle pekne múdro usilovne opatrne odvážne blízko ďaleko hore dolu vpredu vzadu doma vonku spolu zvlášť často zriedka vždy nikdy občas znova najprv nakoniec všade nikde sem tam odtiaľ potichu nahlas jasne presne správne krivo rovno ľahko ťažko zdravo chutne".split(" "),
        preposition: "v na do z zo od ku k pri pred za nad pod medzi cez bez okolo popri proti podľa pre po o u s so vo poza spomedzi ponad popod naproti kvôli vďaka počas mimo namiesto okrem blízko neďaleko oproti".split(" "),
        conjunction: "a i aj ani ale no lebo pretože keď kým ak hoci či alebo buď než aby že ako lenže teda preto veď avšak pokiaľ keby odkedy dokiaľ zatiaľ čo nielen nielenže".split(" "),
        particle: "áno nie nech kiež vari asi vraj práve iba len už ešte predsa nuž však azda hádam iste zrejme údajne možno naozaj veru predovšetkým dokonca sotva najmä práveže bodaj".split(" "),
        interjection: "ach och jaj joj hurá fíha hej halo hop bác bum tresk pif haf mňau kikirikí čľup cŕn tik-tak fuj pst hm aha ejha au auč brm píp šup hybaj hopla jajaj ó óch bác hoho haha hehe".split(" ")
      };

      const presets = [
        ["adverb","adverb","adverb","adverb","numeral","numeral","adverb","adverb","adverb","adverb","adverb","adverb","adverb","numeral","noun","noun","numeral","adverb","adverb","adverb","adverb","adverb","numeral","noun","noun","noun","noun","numeral","adverb","adverb","adverb","numeral","noun","noun","noun","noun","noun","noun","numeral","adverb","adverb","numeral","noun","noun","noun","noun","noun","noun","numeral","adverb","adverb","adverb","numeral","noun","noun","noun","noun","numeral","adverb","adverb","adverb","adverb","adverb","numeral","verb","verb","numeral","adverb","adverb","adverb","adverb","adverb","adverb","adjective","verb","verb","adjective","adverb","adverb","adverb","adverb","adverb","adjective","adjective","verb","verb","adjective","adjective","adverb","adverb","adverb","adjective","adjective","adjective","verb","verb","adjective","adjective","adjective","adverb","adverb"],
        ["preposition","preposition","preposition","preposition","preposition","preposition","preposition","preposition","preposition","preposition","preposition","preposition","conjunction","adjective","adjective","adjective","adjective","conjunction","preposition","preposition","preposition","conjunction","adjective","adjective","adjective","adjective","adjective","adjective","conjunction","preposition","conjunction","adjective","adjective","adjective","adjective","adjective","adjective","adjective","adjective","conjunction","noun","noun","noun","noun","noun","noun","noun","noun","noun","noun","noun","noun","verb","noun","noun","noun","noun","verb","noun","noun","noun","noun","verb","noun","noun","noun","noun","verb","noun","noun","noun","noun","noun","noun","noun","noun","noun","noun","noun","noun","noun","noun","noun","noun","conjunction","conjunction","noun","noun","noun","noun","preposition","preposition","preposition","preposition","preposition","preposition","preposition","preposition","preposition","preposition"],
        ["particle","particle","particle","particle","numeral","numeral","numeral","particle","particle","particle","particle","particle","numeral","noun","noun","noun","numeral","particle","particle","particle","particle","numeral","noun","noun","noun","noun","noun","numeral","particle","particle","particle","numeral","noun","pronoun","noun","noun","pronoun","noun","numeral","particle","numeral","noun","noun","noun","noun","noun","noun","noun","noun","numeral","numeral","noun","pronoun","noun","noun","pronoun","noun","noun","numeral","particle","particle","numeral","noun","noun","noun","noun","noun","numeral","particle","particle","particle","particle","numeral","verb","verb","verb","numeral","particle","particle","particle","particle","particle","particle","verb","verb","verb","particle","particle","particle","particle","particle","particle","adjective","verb","verb","adjective","particle","particle","particle","adjective","adjective"]
      ];

      function normalizeMap(map) {
        return [...map, ...Array(100).fill("noun")].slice(0, 100);
      }

      const defaultColors = Object.fromEntries(parts.map((part) => [part.id, part.color]));
      const sheets = Array.from({ length: 10 }, (_, index) => ({
        title: "Pracovný list - Tajný obrázok",
        description: defaultDescription,
        colors: { ...defaultColors },
        map: normalizeMap(presets[index % presets.length]),
        words: []
      }));

      let activeSheet = 0;
      let activePart = "noun";

      const sheetTabs = document.getElementById("sheetTabs");
      const titleInput = document.getElementById("titleInput");
      const descriptionInput = document.getElementById("descriptionInput");
      const activePartSelect = document.getElementById("activePartSelect");
      const mapGrid = document.getElementById("mapGrid");
      const colorGrid = document.getElementById("colorGrid");
      const preview = document.getElementById("preview");
      const printStack = document.getElementById("printStack");

      function shuffle(values, seed) {
        const copy = [...values];
        let state = seed + 17;
        for (let index = copy.length - 1; index > 0; index -= 1) {
          state = (state * 9301 + 49297) % 233280;
          const swapIndex = Math.floor((state / 233280) * (index + 1));
          [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
        }
        return copy;
      }

      function uniqueWordsFor(partId, count, seed) {
        const source = banks[partId];
        const result = shuffle(source, seed);
        let extra = 1;
        while (result.length < count) {
          result.push(`${source[(extra - 1) % source.length]} ${extra}`);
          extra += 1;
        }
        return result.slice(0, count);
      }

      function generateWords(sheetIndex) {
        const sheet = sheets[sheetIndex];
        const counts = {};
        sheet.map.forEach((partId) => {
          counts[partId] = (counts[partId] || 0) + 1;
        });

        const pools = {};
        Object.entries(counts).forEach(([partId, count], order) => {
          pools[partId] = uniqueWordsFor(partId, count + 30, sheetIndex * 101 + order * 19 + Date.now() % 997);
        });

        const used = {};
        const usedWords = new Set();
        sheet.words = sheet.map.map((partId) => {
          used[partId] = used[partId] || 0;
          let word = pools[partId][used[partId]];
          while (usedWords.has(word)) {
            used[partId] += 1;
            word = pools[partId][used[partId]] || `${partById[partId].label} ${used[partId] + 1}`;
          }
          usedWords.add(word);
          used[partId] += 1;
          return word;
        });
      }

      function ensureWords(sheetIndex) {
        if (!sheets[sheetIndex].words.length) {
          generateWords(sheetIndex);
        }
      }

      function partOptions(selectedId) {
        return parts.map((part) => `<option value="${part.id}" ${part.id === selectedId ? "selected" : ""}>${part.short} - ${part.label}</option>`).join("");
      }

      function renderTabs() {
        sheetTabs.innerHTML = sheets.map((sheet, index) => `
          <button class="sheet-tab ${index === activeSheet ? "active" : ""}" type="button" data-sheet="${index}">
            <span class="mini" aria-hidden="true">
              ${sheet.map.slice(0, 25).map((partId) => `<i style="background:${sheet.colors[partId]}"></i>`).join("")}
            </span>
            <span><strong>PL ${index + 1}</strong><small>${sheet.title}</small></span>
          </button>
        `).join("");
      }

      function renderEditor() {
        const sheet = sheets[activeSheet];
        titleInput.value = sheet.title;
        descriptionInput.value = sheet.description;
        activePartSelect.innerHTML = partOptions(activePart);
        mapGrid.innerHTML = sheet.map.map((partId, index) => `
          <div class="map-cell">
            <select data-cell="${index}" style="background:${sheet.colors[partId]}">${partOptions(partId)}</select>
          </div>
        `).join("");
        colorGrid.innerHTML = parts.map((part) => `
          <label class="color-row">
            <input type="color" value="${sheet.colors[part.id]}" data-color="${part.id}" />
            <span><strong>${part.label}</strong><small>${part.short}</small></span>
          </label>
        `).join("");
      }

      function worksheetHtml(sheet, options = {}) {
        ensureWords(sheets.indexOf(sheet));
        const usedParts = [...new Set(sheet.map)];
        return `
          <article class="worksheet ${options.print ? "print-sheet" : ""}">
            <h2>${sheet.title}</h2>
            <p class="worksheet-desc">${sheet.description}</p>
            <div class="legend">
              ${parts.map((part) => `
                <div class="legend-item">
                  <span class="swatch" style="background:${sheet.colors[part.id]}"></span>${part.label}
                </div>
              `).join("")}
            </div>
            <div class="worksheet-grid">
              ${sheet.words.map((word) => `<div class="word-cell">${word}</div>`).join("")}
            </div>
            <div class="answer-space">Správna odpoveď: </div>
            ${options.key ? `
              <div class="answer-key">
                <p class="section-title">Farebné riešenie pre učiteľa</p>
                <div class="worksheet-grid">
                  ${sheet.map.map((partId) => `<div class="word-cell" style="background:${sheet.colors[partId]}">${partById[partId].short}</div>`).join("")}
                </div>
              </div>
            ` : ""}
          </article>
        `;
      }

      function renderPreview() {
        ensureWords(activeSheet);
        preview.innerHTML = worksheetHtml(sheets[activeSheet], { key: true });
      }

      function saveTextFields() {
        sheets[activeSheet].title = titleInput.value.trim() || "Pracovný list - Tajný obrázok";
        sheets[activeSheet].description = descriptionInput.value.trim() || defaultDescription;
      }

      function renderAll() {
        renderTabs();
        renderEditor();
        renderPreview();
      }

      sheetTabs.addEventListener("click", (event) => {
        const tab = event.target.closest("[data-sheet]");
        if (!tab) return;
        saveTextFields();
        activeSheet = Number(tab.dataset.sheet);
        renderAll();
      });

      titleInput.addEventListener("input", () => {
        saveTextFields();
        renderTabs();
      });

      descriptionInput.addEventListener("input", saveTextFields);

      activePartSelect.addEventListener("change", () => {
        activePart = activePartSelect.value;
      });

      mapGrid.addEventListener("change", (event) => {
        const select = event.target.closest("[data-cell]");
        if (!select) return;
        const sheet = sheets[activeSheet];
        sheet.map[Number(select.dataset.cell)] = select.value;
        sheet.words = [];
        renderAll();
      });

      mapGrid.addEventListener("click", (event) => {
        const select = event.target.closest("[data-cell]");
        if (!select || event.detail !== 2) return;
        const sheet = sheets[activeSheet];
        sheet.map[Number(select.dataset.cell)] = activePart;
        sheet.words = [];
        renderAll();
      });

      colorGrid.addEventListener("input", (event) => {
        const input = event.target.closest("[data-color]");
        if (!input) return;
        sheets[activeSheet].colors[input.dataset.color] = input.value;
        renderAll();
      });

      document.getElementById("fillButton").addEventListener("click", () => {
        sheets[activeSheet].map = Array(100).fill(activePart);
        sheets[activeSheet].words = [];
        renderAll();
      });

      document.getElementById("clearButton").addEventListener("click", () => {
        sheets[activeSheet].map = Array(100).fill("noun");
        sheets[activeSheet].words = [];
        renderAll();
      });

      document.getElementById("generateButton").addEventListener("click", () => {
        saveTextFields();
        generateWords(activeSheet);
        renderAll();
      });

      document.getElementById("refreshPreviewButton").addEventListener("click", () => {
        saveTextFields();
        renderPreview();
      });

      document.getElementById("printCurrentButton").addEventListener("click", () => {
        saveTextFields();
        ensureWords(activeSheet);
        printStack.innerHTML = worksheetHtml(sheets[activeSheet], { print: true });
        window.print();
      });

      document.getElementById("printAllButton").addEventListener("click", () => {
        saveTextFields();
        sheets.forEach((_, index) => ensureWords(index));
        printStack.innerHTML = sheets.map((sheet) => worksheetHtml(sheet, { print: true })).join("");
        window.print();
      });

      sheets.forEach((_, index) => generateWords(index));
      renderAll();
    </script>
  </body>
</html>
