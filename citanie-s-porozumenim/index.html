<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Čítanie s porozumením</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18212f;
      --muted: #586477;
      --paper: #fffdfa;
      --line: #d8e0e8;
      --sky: #d8f0ff;
      --mint: #dff7ec;
      --sun: #ffe6a7;
      --coral: #ffad99;
      --blue: #246bce;
      --blue-dark: #174b93;
      --green: #1f8a5b;
      --red: #b84435;
      --shadow: 0 18px 45px rgba(20, 32, 55, 0.13);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 18px;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(216, 240, 255, 0.95), rgba(223, 247, 236, 0.95) 48%, rgba(255, 230, 167, 0.9)),
        #f4fbff;
    }

    button {
      border: 0;
      cursor: pointer;
      font: inherit;
    }

    .app {
      width: min(1120px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 36px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 0 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 3rem);
      line-height: 1.05;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 8px 12px;
      border: 2px solid rgba(36, 107, 206, 0.2);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--blue-dark);
      font-weight: 800;
      white-space: nowrap;
    }

    .scene {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      gap: 20px;
      align-items: end;
      margin-bottom: 18px;
      padding: 22px;
      border-radius: 8px;
      background: rgba(255, 253, 250, 0.7);
      border: 1px solid rgba(216, 224, 232, 0.75);
      box-shadow: var(--shadow);
    }

    .scene p {
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.45;
      max-width: 720px;
    }

    .book-art {
      width: 100%;
      min-height: 150px;
    }

    .layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .text-list,
    .reader,
    .quiz,
    .finish {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .text-list {
      padding: 14px;
      position: sticky;
      top: 14px;
    }

    .text-list h2,
    .reader h2,
    .quiz h2,
    .finish h2 {
      margin: 0;
      font-size: 1.35rem;
      line-height: 1.2;
    }

    .text-buttons {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .text-button {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 52px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      color: var(--ink);
      text-align: left;
    }

    .text-button:hover,
    .text-button:focus-visible {
      border-color: var(--blue);
      outline: 3px solid rgba(36, 107, 206, 0.18);
    }

    .text-button.active {
      background: #eaf3ff;
      border-color: var(--blue);
    }

    .text-button.done {
      border-color: rgba(31, 138, 91, 0.55);
    }

    .number {
      display: inline-grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--sun);
      font-weight: 900;
    }

    .button-title {
      overflow-wrap: anywhere;
      font-weight: 800;
      line-height: 1.2;
    }

    .work-area {
      display: grid;
      gap: 18px;
    }

    .reader {
      padding: 22px;
    }

    .reader-header {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .topic {
      margin: 6px 0 0;
      color: var(--muted);
      font-weight: 700;
    }

    .story {
      margin: 0;
      padding: 18px;
      border: 2px solid #f1d48b;
      border-radius: 8px;
      background: #fff8e8;
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.75;
    }

    .quiz {
      padding: 22px;
    }

    .question-count {
      margin: 0 0 8px;
      color: var(--blue-dark);
      font-weight: 900;
    }

    .question-text {
      margin: 0 0 14px;
      font-size: clamp(1.25rem, 2.5vw, 1.7rem);
      line-height: 1.25;
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer {
      min-height: 56px;
      padding: 12px 14px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      color: var(--ink);
      text-align: left;
      font-weight: 750;
      line-height: 1.25;
    }

    .answer:hover,
    .answer:focus-visible {
      border-color: var(--blue);
      outline: 3px solid rgba(36, 107, 206, 0.18);
    }

    .answer.correct {
      background: #e7f8ef;
      border-color: var(--green);
      color: #115d3b;
    }

    .answer.wrong {
      background: #fff0ec;
      border-color: var(--red);
      color: #812b22;
    }

    .answer:disabled {
      cursor: default;
    }

    .feedback {
      min-height: 34px;
      margin: 14px 0 0;
      color: var(--muted);
      font-weight: 800;
      line-height: 1.35;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .primary,
    .secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 11px 16px;
      border-radius: 8px;
      font-weight: 900;
    }

    .primary {
      background: var(--blue);
      color: #ffffff;
    }

    .primary:hover,
    .primary:focus-visible {
      background: var(--blue-dark);
      outline: 3px solid rgba(36, 107, 206, 0.2);
    }

    .secondary {
      border: 2px solid var(--line);
      background: #ffffff;
      color: var(--blue-dark);
    }

    .secondary:hover,
    .secondary:focus-visible {
      border-color: var(--blue);
      outline: 3px solid rgba(36, 107, 206, 0.18);
    }

    .finish {
      padding: 22px;
      background: linear-gradient(135deg, #e9f8ff, #fff3d1);
      border-color: rgba(36, 107, 206, 0.2);
    }

    .finish p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.45;
      font-weight: 700;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 820px) {
      body {
        font-size: 16px;
      }

      .scene {
        grid-template-columns: 1fr;
      }

      .book-art {
        max-width: 220px;
        justify-self: center;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .text-list {
        position: static;
      }

      .text-buttons {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      .app {
        width: min(100% - 20px, 1120px);
        padding-top: 12px;
      }

      .topbar,
      .reader-header {
        align-items: stretch;
        flex-direction: column;
      }

      .text-buttons {
        grid-template-columns: 1fr;
      }

      .scene,
      .reader,
      .quiz,
      .finish {
        padding: 16px;
      }

      .story {
        padding: 14px;
        line-height: 1.65;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <h1>Čítanie s porozumením</h1>
      <div class="badge" id="completedBadge">Hotovo 0 / 10</div>
    </div>

    <section class="scene" aria-label="Úvod">
      <div>
        <h2>Vyber si text, prečítaj ho a odpovedz na otázky.</h2>
        <p>Krátke príbehy sú pripravené pre prváka. Po každom dokončení ťa čaká pochvala.</p>
      </div>
      <svg class="book-art" viewBox="0 0 240 170" role="img" aria-label="Otvorená kniha">
        <rect x="12" y="32" width="92" height="112" rx="8" fill="#ffffff" stroke="#246bce" stroke-width="5"/>
        <rect x="136" y="32" width="92" height="112" rx="8" fill="#ffffff" stroke="#246bce" stroke-width="5"/>
        <path d="M104 37c14 11 18 27 16 103" fill="none" stroke="#174b93" stroke-width="5" stroke-linecap="round"/>
        <path d="M136 37c-14 11-18 27-16 103" fill="none" stroke="#174b93" stroke-width="5" stroke-linecap="round"/>
        <path d="M34 61h45M34 81h50M34 101h38M158 61h45M158 81h42M158 101h32" stroke="#9eb7d6" stroke-width="6" stroke-linecap="round"/>
        <circle cx="120" cy="21" r="13" fill="#ffe6a7" stroke="#d19a1f" stroke-width="4"/>
        <path d="M41 146h158" stroke="#ffad99" stroke-width="10" stroke-linecap="round"/>
      </svg>
    </section>

    <div class="layout">
      <aside class="text-list" aria-label="Výber textu">
        <h2>10 textov</h2>
        <div class="text-buttons" id="textButtons"></div>
      </aside>

      <div class="work-area">
        <section class="reader" aria-label="Text na čítanie">
          <div class="reader-header">
            <div>
              <h2 id="storyTitle"></h2>
              <p class="topic" id="storyTopic"></p>
            </div>
            <button class="secondary" id="resetTextButton" type="button">Začať text znova</button>
          </div>
          <p class="story" id="storyText"></p>
        </section>

        <section class="quiz" aria-label="Otázky s porozumením">
          <p class="question-count" id="questionCount"></p>
          <h2 class="question-text" id="questionText"></h2>
          <div class="answers" id="answers"></div>
          <p class="feedback" id="feedback" aria-live="polite"></p>
          <div class="actions">
            <button class="primary hidden" id="nextButton" type="button">Ďalšia otázka</button>
          </div>
        </section>

        <section class="finish hidden" id="finishBox" aria-live="polite">
          <h2 id="finishTitle"></h2>
          <p id="finishText"></p>
          <div class="actions">
            <button class="primary" id="chooseNextButton" type="button">Vybrať ďalší text</button>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script>
    const stories = [
      {
        title: "Ranné prekvapenie",
        topic: "domov a rodina",
        text: "Nina sa ráno zobudila skôr ako budík. V kuchyni počula tiché cinkanie lyžičky. Mama miešala kakao a otec hľadal červenú stužku. Na stole ležal malý balíček. Nina mala meniny. V balíčku bola záložka do knihy so žltou hviezdou. Nina sa usmiala, dala si kakao a hneď ju vložila do čítanky.",
        questions: [
          { text: "Kto sa zobudil skôr ako budík?", answers: ["Nina", "mama", "otec"], correct: 0 },
          { text: "Čo bolo v malom balíčku?", answers: ["záložka do knihy", "modrá ceruzka", "nový pohár"], correct: 0 },
          { text: "Prečo mala Nina radosť?", answers: ["mala meniny", "išla na výlet", "našla loptu"], correct: 0 }
        ]
      },
      {
        title: "Stratená rukavica",
        topic: "škola",
        text: "Tomáš si po prestávke všimol, že mu chýba jedna zelená rukavica. Pozrel do tašky, pod lavicu aj k šatni. Rukavicu nenašiel. Potom sa ozvala Lea. Držala ju v ruke a smiala sa. Rukavica ležala pri triednej knižnici. Tomáš sa poďakoval a položil rukavice spolu do vrecka.",
        questions: [
          { text: "Akej farby bola Tomášova rukavica?", answers: ["zelená", "čierna", "biela"], correct: 0 },
          { text: "Kde rukavica ležala?", answers: ["pri triednej knižnici", "na ihrisku", "v jedálni"], correct: 0 },
          { text: "Kto rukavicu našiel?", answers: ["Lea", "pani učiteľka", "Matúš"], correct: 0 }
        ]
      },
      {
        title: "Koláč pre babku",
        topic: "pomoc doma",
        text: "Ema chcela potešiť babku. S dedkom upiekla jablkový koláč. Ema umyla jablká, dedko ich pokrájal a spolu posypali cesto škoricou. Keď koláč vychladol, dali ho do krabice. Babka otvorila dvere a hneď zacítila sladkú vôňu. Objala Emu a povedala, že taký darček chutí najlepšie.",
        questions: [
          { text: "Aký koláč Ema s dedkom upiekla?", answers: ["jablkový", "makový", "čokoládový"], correct: 0 },
          { text: "Čo urobila Ema s jablkami?", answers: ["umyla ich", "hodila ich do koša", "schovala ich"], correct: 0 },
          { text: "Komu bol koláč určený?", answers: ["babke", "susede", "triede"], correct: 0 }
        ]
      },
      {
        title: "Vlak do mesta",
        topic: "cestovanie",
        text: "Marek išiel prvý raz vlakom do mesta. Sedel pri okne a počítal stanice. Na prvej nastúpil pán s kufrom, na druhej mamička s dieťaťom a na tretej hudobník s gitarou. Marek si všimol, že vlak ide ticho a rýchlo. Keď vystúpil, vedel povedať, že prešli tri stanice.",
        questions: [
          { text: "Kde sedel Marek?", answers: ["pri okne", "pri dverách", "na zemi"], correct: 0 },
          { text: "Koľko staníc Marek napočítal?", answers: ["tri", "päť", "jednu"], correct: 0 },
          { text: "Kto mal gitaru?", answers: ["hudobník", "pán s kufrom", "Marek"], correct: 0 }
        ]
      },
      {
        title: "Tichý dážď",
        topic: "počasie",
        text: "Po obede začalo pršať. Kvapky klopkali na parapet a v záhrade sa leskli listy. Sofia si obula gumáky a vzala žltý pršiplášť. Vonku preskočila tri malé mláky. Potom si všimla, že pri bránke stojí susedkin košík. Zaniesla ho pod strechu, aby nezmokol.",
        questions: [
          { text: "Kedy začalo pršať?", answers: ["po obede", "ráno", "večer"], correct: 0 },
          { text: "Čo si Sofia obliekla?", answers: ["žltý pršiplášť", "červenú bundu", "modrú čiapku"], correct: 0 },
          { text: "Prečo zaniesla košík pod strechu?", answers: ["aby nezmokol", "aby ho naplnila", "aby ho stratila"], correct: 0 }
        ]
      },
      {
        title: "Kniha z knižnice",
        topic: "knihy",
        text: "Adam si v knižnici vybral knihu o vesmíre. Na obálke bola raketa a veľký mesiac. Pani knihovníčka mu ukázala, kde je pečiatka s dátumom vrátenia. Adam doma čítal každý večer dve strany. Najviac sa mu páčila časť o tom, ako astronauti spia vo vaku.",
        questions: [
          { text: "O čom bola Adamova kniha?", answers: ["o vesmíre", "o varení", "o futbale"], correct: 0 },
          { text: "Čo bolo na obálke knihy?", answers: ["raketa a mesiac", "auto a cesta", "les a rieka"], correct: 0 },
          { text: "Koľko strán Adam čítal každý večer?", answers: ["dve", "desať", "žiadnu"], correct: 0 }
        ]
      },
      {
        title: "Nová lavica",
        topic: "trieda",
        text: "V triede pribudla nová lavica. Bola pri okne, kde svietilo veľa slnka. Pani učiteľka povedala, že tam budú sedieť deti pri skupinovej práci. Deti si do lavice uložili farebné papiere, lepidlo a nožnice. Prvá skupina z nich vyrobila plagát o jarnej lúke.",
        questions: [
          { text: "Kde stála nová lavica?", answers: ["pri okne", "pri tabuli", "na chodbe"], correct: 0 },
          { text: "Na čo mala lavica slúžiť?", answers: ["na skupinovú prácu", "na obed", "na spanie"], correct: 0 },
          { text: "O čom bol prvý plagát?", answers: ["o jarnej lúke", "o zime", "o meste"], correct: 0 }
        ]
      },
      {
        title: "Lopta na streche",
        topic: "ihrisko",
        text: "Deti hrali na dvore loptovú hru. Juraj kopol loptu príliš vysoko a lopta skončila na nízkej streche skladu. Deti ju nevedeli dočiahnuť. Zavolali školníka, ktorý priniesol dlhú metlu. Lopta sa zgúľala dole a hra mohla pokračovať. Juraj potom kopal opatrnejšie.",
        questions: [
          { text: "Kde skončila lopta?", answers: ["na streche skladu", "v potoku", "v triede"], correct: 0 },
          { text: "Kto deťom pomohol?", answers: ["školník", "lekárka", "predavač"], correct: 0 },
          { text: "Čo priniesol pomocník?", answers: ["dlhú metlu", "papierový rebrík", "vedro vody"], correct: 0 }
        ]
      },
      {
        title: "Modrý hrnček",
        topic: "pozornosť",
        text: "Lilka dostala modrý hrnček s bielymi bodkami. Nosila si v ňom čaj, keď sa učila čítať. Raz hrnček nebol na stole. Lilka ho hľadala v izbe aj v kuchyni. Nakoniec ho našla pri umývadle. Ocko ho umyl a nechal ho tam uschnúť.",
        questions: [
          { text: "Akej farby bol Lilkin hrnček?", answers: ["modrý s bielymi bodkami", "zelený s pásikmi", "žltý bez bodiek"], correct: 0 },
          { text: "Čo pila Lilka z hrnčeka?", answers: ["čaj", "vodu s citrónom", "mlieko"], correct: 0 },
          { text: "Kde Lilka hrnček našla?", answers: ["pri umývadle", "v taške", "pod posteľou"], correct: 0 }
        ]
      },
      {
        title: "List pre kamaráta",
        topic: "priateľstvo",
        text: "Samko písal list pre kamaráta Nora, ktorý bol doma chorý. Nakreslil mu slnko, dom a usmiatu triedu. Do listu napísal, že všetci na Nora myslia. Pani učiteľka list vložila do obálky. Na druhý deň Noro poslal správu, že sa pri liste hneď cítil lepšie.",
        questions: [
          { text: "Komu písal Samko list?", answers: ["Norovi", "babke", "pani kuchárke"], correct: 0 },
          { text: "Prečo bol Noro doma?", answers: ["bol chorý", "mal prázdniny", "stratil topánky"], correct: 0 },
          { text: "Ako sa Noro cítil po liste?", answers: ["lepšie", "smutnejšie", "nahnevane"], correct: 0 }
        ]
      }
    ];

    const praise = [
      "Výborné čítanie! Pekne si sledoval/a, čo sa v texte dialo.",
      "Paráda! Odpovede ukazujú, že si text čítal/a pozorne.",
      "Super práca! Tvoja čitateľská sila rastie.",
      "Krásne dokončené! Môžeš byť na seba hrdý/hrdá."
    ];

    const state = {
      storyIndex: 0,
      questionIndex: 0,
      answered: false,
      completed: new Set()
    };

    const textButtons = document.getElementById("textButtons");
    const completedBadge = document.getElementById("completedBadge");
    const storyTitle = document.getElementById("storyTitle");
    const storyTopic = document.getElementById("storyTopic");
    const storyText = document.getElementById("storyText");
    const questionCount = document.getElementById("questionCount");
    const questionText = document.getElementById("questionText");
    const answers = document.getElementById("answers");
    const feedback = document.getElementById("feedback");
    const nextButton = document.getElementById("nextButton");
    const finishBox = document.getElementById("finishBox");
    const finishTitle = document.getElementById("finishTitle");
    const finishText = document.getElementById("finishText");
    const chooseNextButton = document.getElementById("chooseNextButton");
    const resetTextButton = document.getElementById("resetTextButton");

    function shuffle(items) {
      return items
        .map((item) => ({ item, sort: Math.random() }))
        .sort((a, b) => a.sort - b.sort)
        .map(({ item }) => item);
    }

    function renderButtons() {
      textButtons.innerHTML = "";
      stories.forEach((story, index) => {
        const button = document.createElement("button");
        button.className = "text-button";
        if (index === state.storyIndex) button.classList.add("active");
        if (state.completed.has(index)) button.classList.add("done");
        button.type = "button";
        button.innerHTML = `
          <span class="number">${index + 1}</span>
          <span class="button-title">${story.title}</span>
        `;
        button.addEventListener("click", () => selectStory(index));
        textButtons.appendChild(button);
      });
      completedBadge.textContent = `Hotovo ${state.completed.size} / ${stories.length}`;
    }

    function selectStory(index) {
      state.storyIndex = index;
      state.questionIndex = 0;
      state.answered = false;
      finishBox.classList.add("hidden");
      render();
    }

    function renderStory() {
      const story = stories[state.storyIndex];
      storyTitle.textContent = story.title;
      storyTopic.textContent = story.topic;
      storyText.textContent = story.text;
    }

    function renderQuestion() {
      const story = stories[state.storyIndex];
      const question = story.questions[state.questionIndex];
      questionCount.textContent = `Otázka ${state.questionIndex + 1} z ${story.questions.length}`;
      questionText.textContent = question.text;
      feedback.textContent = "Vyber jednu odpoveď.";
      nextButton.classList.add("hidden");
      answers.innerHTML = "";

      shuffle(question.answers.map((answer, index) => ({
        text: answer,
        correct: index === question.correct
      }))).forEach((answer) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.type = "button";
        button.textContent = answer.text;
        button.addEventListener("click", () => checkAnswer(button, answer.correct));
        answers.appendChild(button);
      });
    }

    function checkAnswer(button, isCorrect) {
      if (state.answered) return;
      if (!isCorrect) {
        button.classList.add("wrong");
        feedback.textContent = "Skús ešte raz. Pozri sa naspäť do textu.";
        return;
      }

      state.answered = true;
      button.classList.add("correct");
      Array.from(answers.children).forEach((answerButton) => {
        answerButton.disabled = true;
      });
      feedback.textContent = "Správne!";
      nextButton.textContent = state.questionIndex === stories[state.storyIndex].questions.length - 1
        ? "Dokončiť text"
        : "Ďalšia otázka";
      nextButton.classList.remove("hidden");
    }

    function finishStory() {
      state.completed.add(state.storyIndex);
      finishTitle.textContent = "Hotovo, výborne!";
      finishText.textContent = praise[state.completed.size % praise.length];
      finishBox.classList.remove("hidden");
      renderButtons();
    }

    function nextStep() {
      const story = stories[state.storyIndex];
      if (state.questionIndex < story.questions.length - 1) {
        state.questionIndex += 1;
        state.answered = false;
        renderQuestion();
        return;
      }
      finishStory();
    }

    function chooseNextStory() {
      const nextIndex = stories.findIndex((story, index) => !state.completed.has(index));
      selectStory(nextIndex === -1 ? 0 : nextIndex);
    }

    function render() {
      renderButtons();
      renderStory();
      renderQuestion();
    }

    nextButton.addEventListener("click", nextStep);
    chooseNextButton.addEventListener("click", chooseNextStory);
    resetTextButton.addEventListener("click", () => selectStory(state.storyIndex));

    render();
  </script>
</body>
</html>
